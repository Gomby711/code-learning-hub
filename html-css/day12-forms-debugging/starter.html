<!DOCTYPE html>
<html>
<head>
    <title>Day 12 Practice - Forms and Debugging</title>
    <link rel="stylesheet" href="starter.css">
</head>
<body>
    <h2>Part 1: Validation styling</h2>
    <form>
        <label for="username">Username (required, min 3 letters):</label>
        <input type="text" id="username" name="username" required minlength="3" placeholder=" ">
        <br><br>
        <label for="email">Email (required):</label>
        <input type="email" id="email" name="email" required placeholder=" ">
        <br><br>
        <button type="submit">Submit</button>
    </form>

    <h2>Part 2: Find and fix the bug</h2>
    <!-- This "broken-layout" section SHOULD show 3 equal boxes side by side using flexbox,
         but something is preventing it from working. Use the debugging process from
         lesson.md: inspect .broken-layout in DevTools, check the Styles panel for any
         rule that's overriding what you'd expect, and find the actual cause before
         editing anything. (Hint: there are TWO conflicting rules targeting the same
         property on the same selector, and the more specific one is winning.) -->
    <div class="broken-layout">
        <div class="broken-box">Box 1</div>
        <div class="broken-box">Box 2</div>
        <div class="broken-box">Box 3</div>
    </div>
</body>
</html>
