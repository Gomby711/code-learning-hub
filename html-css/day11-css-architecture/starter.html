<!DOCTYPE html>
<html>

    <title>Day 11 Practice - BEM</title>

         e.g. class="card" / class="card__image" / class="card__button card__button--primary" -->

    <div class="box">

        <h3 class="heading">Wireless Mouse</h3>
        <p class="desc">A comfortable, ergonomic wireless mouse.</p>
        <button class="btn btn-main">Buy Now</button>
        <button class="btn btn-alt">Add to Wishlist</button>
    </div>
