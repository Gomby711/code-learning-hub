<!DOCTYPE html>
<html>
<head>
    <title>Day 6 Practice - CSS Grid</title>
    <link rel="stylesheet" href="starter.css">
</head>
<body>
    <h2>Part 1: A 3-column photo gallery, with one featured item</h2>
    <div class="gallery">
        <div class="item featured">Featured (spans 2 columns)</div>
        <div class="item">Photo 2</div>
        <div class="item">Photo 3</div>
        <div class="item">Photo 4</div>
        <div class="item">Photo 5</div>
    </div>

    <h2>Part 2: A full page layout using grid-template-areas</h2>
    <div class="page">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
