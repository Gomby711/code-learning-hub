<!DOCTYPE html>
<html>
<head>
    <title>Day 9 Practice - CSS Advanced</title>
    <link rel="stylesheet" href="solution.css">
</head>
<body>
    <h2>Part 1: pseudo-classes</h2>
    <ul class="list">
        <li>Item one</li>
        <li>Item two</li>
        <li>Item three</li>
        <li>Item four</li>
    </ul>
    <a href="#" class="link">Hover over me</a>
    <br><br>
    <input type="text" placeholder="Click into me (focus)">

    <h2>Part 2: pseudo-elements</h2>
    <p class="quote">This text should get curly quote marks added around it, purely via CSS.</p>

    <h2>Part 3: transition</h2>
    <button class="animated-button">Hover over me smoothly</button>

    <h2>Part 4: keyframes</h2>
    <div class="bouncing-ball"></div>

    <h2>Part 5: custom properties</h2>
    <button class="themed-button">Themed Button</button>
</body>
</html>
